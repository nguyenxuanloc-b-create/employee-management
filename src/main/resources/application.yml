spring:
  application:
    name: employee-management
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=200,expireAfterWrite=60s

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: when_authorized

app:
  jwt:
    # Development fallback only. Set JWT_SECRET in real deployments.
    secret: ${JWT_SECRET:U3ByaW5nQm9vdC1FbXBsb3llZS1NYW5hZ2VtZW50LTIwMjYhISE=}
