<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle}">Employee Form</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="container narrow">
    <a th:href="@{/employees/list}">Back to list</a>
    <h1 th:text="${pageTitle}">Employee Form</h1>

    <form class="card form" th:action="${formAction}" th:object="${employeeForm}" method="post">
        <label>
            Name
            <input type="text" th:field="*{name}" placeholder="Nguyen Van An">
            <span class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
        </label>

        <label>
            Email
            <input type="email" th:field="*{email}" placeholder="an@example.com">
            <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
        </label>

        <label>
            Department
            <input type="text" th:field="*{departmentName}" placeholder="IT">
            <span class="field-error" th:if="${#fields.hasErrors('departmentName')}" th:errors="*{departmentName}"></span>
        </label>

        <button type="submit">Save</button>
    </form>
</main>
</body>
</html>
